<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FloorLogic demo compositor</title>
<style>
@font-face{font-family:'Supreme';src:url(/fonts/supreme-800.woff2) format('woff2');font-weight:800;font-display:block}
@font-face{font-family:'Supreme';src:url(/fonts/supreme-500.woff2) format('woff2');font-weight:500;font-display:block}
@font-face{font-family:'Satoshi';src:url(/fonts/satoshi-400.woff2) format('woff2');font-weight:400;font-display:block}
@font-face{font-family:'Satoshi';src:url(/fonts/satoshi-500.woff2) format('woff2');font-weight:500;font-display:block}
@font-face{font-family:'Satoshi';src:url(/fonts/satoshi-700.woff2) format('woff2');font-weight:700;font-display:block}
:root{
  --navy:#02315B; --navy-950:#00224f; --navy-700:#155488; --blue:#1470D2; --dot:#1679e2;
  --ice:#F3F8FD; --ice-200:#e8f1fb; --ice-300:#d5e5f6; --sky:#a9cbee; --white:#fff; --charcoal:#363a40;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--ice)}
#stage{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;font-family:'Satoshi',system-ui,sans-serif;color:var(--navy)}
/* ground: ice wash + faint plank lattice echoing the mark */
#bg{position:absolute;inset:0;background:
  radial-gradient(1200px 800px at 12% 8%, #ffffff 0%, rgba(255,255,255,0) 60%),
  radial-gradient(900px 700px at 92% 96%, #dcebfa 0%, rgba(220,235,250,0) 70%),
  linear-gradient(160deg, #f7fbfe 0%, #eef5fc 55%, #e6f0fa 100%);}
#bg svg{position:absolute;inset:0;opacity:.55}
.layer{position:absolute;inset:0;will-change:opacity}
/* desktop app window */
.cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.win{position:absolute;border-radius:18px;background:#fff;overflow:hidden;
  box-shadow:0 2px 6px rgba(2,49,91,.06),0 28px 70px -22px rgba(2,49,91,.38),0 0 0 1px rgba(2,49,91,.08)}
.win{z-index:0;isolation:isolate}   /* stills stack inside the window only */
.win .vp{position:absolute;left:0;top:0;transform-origin:0 0}
.cam > .vp{position:absolute;left:0;top:0;z-index:50;pointer-events:none}
.win img.still{position:absolute;left:0;top:0;display:block}
/* cursor + click ripple */
.cursor{position:absolute;left:0;top:0;width:34px;height:40px;pointer-events:none;transform-origin:0 0;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}
.ripple{position:absolute;left:0;top:0;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;border:4px solid var(--blue);opacity:0;pointer-events:none}
.tap{position:absolute;left:0;top:0;width:74px;height:74px;margin:-37px 0 0 -37px;border-radius:50%;background:rgba(20,112,210,.28);border:3px solid rgba(255,255,255,.95);box-shadow:0 0 0 2px rgba(20,112,210,.5);opacity:0;pointer-events:none}
/* highlight ring: level, drawn in camera space so it zooms with the shot */
.ring{position:absolute;border-radius:12px;pointer-events:none;transform-origin:50% 50%;z-index:57;
  box-shadow:0 0 0 3px rgba(20,112,210,.92),0 0 0 9px rgba(20,112,210,.16),0 12px 30px -10px rgba(2,49,91,.35)}
/* phone */
.phone{position:absolute;width:438px;height:922px;border-radius:66px;background:#0d1724;
  box-shadow:0 0 0 2px #2a3443 inset,0 40px 90px -30px rgba(2,49,91,.55),0 10px 30px -10px rgba(2,49,91,.35)}
.phone .scr{position:absolute;left:14px;top:14px;width:410px;height:894px;border-radius:52px;overflow:hidden;background:#fff}
.phone .scr .vp{position:absolute;left:0;top:0;transform-origin:0 0}
.phone .island{position:absolute;left:50%;top:26px;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#05080d;z-index:5}
.phone .btn{position:absolute;background:#1b2533;border-radius:3px}
/* cursor wrapper (counter-scaled against camera zoom) */
.curwrap{position:absolute;left:0;top:0;pointer-events:none;z-index:60}
.curwrap .cursor{position:absolute;left:0;top:0;width:34px;height:40px}
.ripple{z-index:58}
/* phone status bar */
.statusbar{position:absolute;left:0;top:0;width:410px;display:flex;align-items:flex-end;justify-content:space-between;box-sizing:border-box;padding:0 26px 9px 40px;background:#fff;z-index:30;
  font:600 16px/1 -apple-system,'SF Pro Text','Segoe UI',system-ui,sans-serif;color:#111;letter-spacing:-.01em}
.statusbar .sb-icons{display:flex;gap:6px;align-items:center}
.statusbar svg{fill:#111}
/* caption card */
.cap{position:absolute;left:72px;bottom:64px;min-width:560px;max-width:980px;padding:24px 30px 26px 30px;border-radius:20px;
  background:var(--navy);color:#fff;box-shadow:0 30px 60px -24px rgba(0,34,79,.6),0 2px 6px rgba(0,34,79,.2)}
.cap .eyebrow{font:700 17px/1 'Satoshi';letter-spacing:.16em;text-transform:uppercase;color:var(--sky);display:flex;align-items:center;gap:12px}
.cap .eyebrow .num{font:800 17px/1 'Supreme';letter-spacing:.06em;color:#fff;background:var(--blue);border-radius:8px;padding:6px 9px 5px}
.cap .text{margin-top:14px;font:700 40px/1.12 'Satoshi';letter-spacing:-.01em;color:#fff}
.cap .count{margin-top:18px;display:flex;width:fit-content;align-items:center;gap:10px;padding:8px 16px 8px 12px;border-radius:999px;background:rgba(255,255,255,.1);
  box-shadow:inset 0 0 0 1.5px rgba(169,203,238,.35);font:700 22px/1 'Satoshi';color:#fff}
.cap .count .n{font:800 26px/1 'Supreme';color:#fff;min-width:16px;text-align:right}
.cap .count .dot{width:12px;height:12px;border-radius:50%;background:var(--dot);box-shadow:0 0 0 4px rgba(22,121,226,.25)}
.cap .count .v{font:700 22px/1 'Satoshi';color:#fff;white-space:nowrap}
.cap .eyebrow .date{margin-left:auto;font:700 16px/1 'Satoshi';letter-spacing:.04em;text-transform:none;color:#fff;background:rgba(255,255,255,.12);border-radius:8px;padding:6px 10px 5px}
.cap.big{left:120px;bottom:auto;top:330px;max-width:820px;padding:30px 36px 32px}
.cap.big .text{font-size:50px;line-height:1.1}
.cap.big .count{margin-top:24px}
/* end card */
#end{position:absolute;inset:0;background:radial-gradient(1100px 700px at 50% 30%, #0b4a80 0%, var(--navy) 55%, var(--navy-950) 100%);opacity:0;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff}
#end .logo{height:132px;width:auto}
#end h1{margin-top:58px;font:800 92px/1 'Supreme';letter-spacing:-.025em;color:#fff}
#end p.sub{margin-top:26px;font:500 36px/1 'Satoshi';color:var(--ice-300)}
#end .url{margin-top:48px;padding:20px 38px;border-radius:999px;background:var(--blue);font:700 36px/1 'Satoshi';letter-spacing:.005em;color:#fff;box-shadow:0 20px 40px -18px rgba(0,0,0,.5)}
</style>
</head>
<body>
<div id="stage">
  <div id="bg">
    <svg width="1920" height="1080" viewBox="0 0 1920 1080" aria-hidden="true">
      <defs>
        <pattern id="iso" width="120" height="69.28" patternUnits="userSpaceOnUse">
          <path d="M0 34.64 L60 0 L120 34.64 L60 69.28 Z" fill="none" stroke="#155488" stroke-opacity=".07" stroke-width="1.2"/>
        </pattern>
        <radialGradient id="fade" cx="50%" cy="45%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#fff" stop-opacity="1"/></radialGradient>
        <mask id="m"><rect width="1920" height="1080" fill="url(#fade)"/></mask>
      </defs>
      <rect width="1920" height="1080" fill="url(#iso)" mask="url(#m)"/>
    </svg>
  </div>
  <div id="scenes"></div>
  <div id="caps"></div>
  <div id="end">
    <img class="logo" id="end-logo" alt="FloorLogic">
    <h1>Start your free 14-day trial</h1>
    <p class="sub">No credit card · No setup fee</p>
    <div class="url">floorlogic.vercel.app</div>
  </div>
</div>
<script src="/gsap/gsap.min.js"></script>
<script src="/gsap/CustomEase.min.js"></script>
<script src="/capture/manifest.js"></script>
<script src="/comp/engine.js"></script>
<script src="/comp/timeline.js"></script>
</body>
</html>
